name: Bot Orologi Automazione
on:
  schedule:
    - cron: '*/15 * * * *' # Gira ogni 15 minuti
  workflow_dispatch: # Questo ti permette di farlo partire a mano per testare

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install vinted-scraper requests
      - name: Esegui monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
